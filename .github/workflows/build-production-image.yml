# Generated by hosthatch-ops/new-server/generate-build-workflows.py.
# Builds immutable images, then waits for the protected K3s production release
# and verifies its result. The deploy job has no server or Kubernetes key.
name: Build production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Preserve the push range and prevent HEAD being treated as a shallow root.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check incoming source for credentials
        run: python3 .github/scripts/security-check.py source
      - name: Run application checks
        run: |
          npm ci
          npm run typecheck

  build:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: song-selfie
            image: ghcr.io/dsauljameson/song-selfie
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Embed the exact source revision in public assets
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -d public ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/hosthatch-revision.json').write_text(
              json.dumps({'repository': os.environ['SOURCE_REPOSITORY'], 'revision': os.environ['SOURCE_REVISION']}) + '\n'
          )
          PY
          fi
      - uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the exact runtime image before production promotion
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/security-check.py image '${{ matrix.image }}@${{ steps.image.outputs.digest }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-${{ matrix.component }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Save release metadata
        env:
          RELEASE_COMPONENT: ${{ matrix.component }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_IMAGE: ${{ matrix.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              'component': os.environ['RELEASE_COMPONENT'],
              'repository': os.environ['RELEASE_REPOSITORY'],
              'revision': os.environ['RELEASE_REVISION'],
              'image': os.environ['RELEASE_IMAGE'] + '@' + os.environ['RELEASE_DIGEST'],
          }
          Path('release.json').write_text(json.dumps(data, indent=2) + '\n')
          print(data['component'], data['revision'], data['image'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-${{ matrix.component }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: song-selfie
            image: ghcr.io/dsauljameson/song-selfie
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read this run's immutable image digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: ${{ matrix.component }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "production-$RELEASE_COMPONENT" --dir "$RUNNER_TEMP/production-release"
      - name: Dispatch and wait for verified K3s production release
        env:
          RELEASE_METADATA_PATH: ${{ runner.temp }}/production-release/release.json
          RELEASE_COMPONENT: ${{ matrix.component }}
          EXPECTED_IMAGE_PACKAGE: ${{ matrix.image }}
          SOURCE_DEFAULT_BRANCH: main
          PRODUCTION_RELEASE_DISPATCH_TOKEN: ${{ secrets.PRODUCTION_RELEASE_DISPATCH_TOKEN }}
        run: python3 .github/scripts/hosthatch-release.py
