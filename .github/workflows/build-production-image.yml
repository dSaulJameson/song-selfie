# Generated by hosthatch-ops/new-server/generate-build-workflows.py.
# This workflow only publishes immutable images. Production changes through
# hosthatch-ops' protected release workflow after source-revision verification.
name: Build production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: song-selfie
            image: ghcr.io/dsauljameson/song-selfie
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Embed the exact source revision in public assets
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -d public ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/hosthatch-revision.json').write_text(
              json.dumps({'repository': os.environ['SOURCE_REPOSITORY'], 'revision': os.environ['SOURCE_REVISION']}) + '\n'
          )
          PY
          fi
      - uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Save release metadata
        env:
          RELEASE_COMPONENT: ${{ matrix.component }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_IMAGE: ${{ matrix.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              'component': os.environ['RELEASE_COMPONENT'],
              'repository': os.environ['RELEASE_REPOSITORY'],
              'revision': os.environ['RELEASE_REVISION'],
              'image': os.environ['RELEASE_IMAGE'] + '@' + os.environ['RELEASE_DIGEST'],
          }
          Path('release.json').write_text(json.dumps(data, indent=2) + '\n')
          print(data['component'], data['revision'], data['image'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-${{ matrix.component }}
          path: release.json
          if-no-files-found: error
          retention-days: 30
