version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    security-patches:
      applies-to: security-updates
      patterns:
      - '*'
    react-runtime:
      applies-to: version-updates
      patterns:
      - react
      - react-dom
      - '@types/react'
      - '@types/react-dom'
